name: APK Builder & Release Maker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs, Library & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APKs and Java Library
        run: ./gradlew assembleDebug assembleRelease :databurner-lib:build --stacktrace

      - name: Get Current Date Version
        id: date_ver
        run: echo "VERSION=$(date +'%y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Java Library JAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: databurner-lib-jar
          path: databurner-lib/build/libs/databurner-lib.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Latest Build ({0})', steps.date_ver.outputs.VERSION) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🚀 Quick Start Dependency (JitPack)

            **Gradle (`build.gradle.kts`)**
            ```kotlin
            repositories {
                maven { url = uri("https://jitpack.io") }
            }

            dependencies {
                implementation("com.github.Latikeshh:Data-Waster:${{ steps.date_ver.outputs.VERSION }}")
            }
            ```

            **Maven (`pom.xml`)**
            ```xml
            <dependency>
                <groupId>com.github.Latikeshh</groupId>
                <artifactId>Data-Waster</artifactId>
                <version>${{ steps.date_ver.outputs.VERSION }}</version>
            </dependency>
            ```

            ---
            *Download binaries below (`app-release.apk`, `app-debug.apk`, `databurner-lib.jar`)*
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            databurner-lib/build/libs/databurner-lib.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
